[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "hometrace"
version = "0.4.1"
description = "Memory-guided object search with offline photo matching and explicit provenance"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8,<10"]
vision = ["opencv-python-headless>=4.10,<5"]
agent = ["langchain-openai==1.0.1", "langchain-core==1.7.0", "langgraph==1.0.2", "python-dotenv==1.2.1", "PyYAML==6.0.3"]

[project.scripts]
hometrace = "hometrace.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
hometrace = ["fixture_data/*.json", "web/*.html", "web/*.css", "web/*.js"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "hometrace"
version = "0.1.0"
description = "Offline fixture demo of memory-guided object search"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8,<10"]

[project.scripts]
hometrace = "hometrace.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
hometrace = ["fixture_data/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

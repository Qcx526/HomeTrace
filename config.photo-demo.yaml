# Bounded photo Demo profile; verified with an old-location -> new-view workflow.
# API Key stays in local .env. Every outgoing photo still requires its own grant.
# This increases only the text-call budget, not detection confidence or authority.
llm:
  provider: openai_compatible
  model: deepseek-v4.1-flash-1017
  base_url: https://token-plan.maas.qianwenaiapi.com/compatible-mode/v1
  timeout_seconds: 45
  max_retries: 0
  use_responses_api: false
agent:
  max_model_calls: 10
  max_tool_calls: 12
  max_viewpoints: 5
  max_total_tokens: 32000
  show_tool_trace: true
vision:
  backend: orb
privacy:
  send_raw_images_to_llm: false
  external_tracing_enabled: false
